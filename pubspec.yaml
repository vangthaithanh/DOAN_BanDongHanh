name: do_an
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  lucide_icons_flutter: ^3.0.5
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  http: ^1.6.0
  camera: ^0.12.0+1
  permission_handler: ^12.0.1
  record: ^6.2.1
  audioplayers: ^6.1.0
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.10.3
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.3.2
  dio: ^5.9.0
  device_info_plus: ^11.1.1
  gal: ^2.3.2
  geocoding: ^4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/static/Inter_24pt-Regular.ttf
        - asset: assets/font/static/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/font/static/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/font/static/Inter_24pt-Bold.ttf
          weight: 700
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
